<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>青山｜限時折扣活動</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#303030;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}main{width:min(100%,500px);margin:auto;padding:28px 18px 48px}.top{position:relative;text-align:center;padding:34px 0 43px}.favorite{position:absolute;right:0;top:0;border:2px solid #13533e;background:transparent;color:#13533e;border-radius:6px;padding:6px 13px;font-size:14px;cursor:pointer}.logo{width:118px;height:118px;border-radius:50%;object-fit:cover;background:white}.top h1{font-size:19px;margin:15px 0 7px}.top p{margin:0;color:#666;font-size:16px}.insta{display:inline-flex;margin-top:26px;color:#11533f;text-decoration:none;font-size:27px;font-weight:bold}.carousel{position:relative;overflow:hidden;border-radius:16px;box-shadow:0 3px 9px #0002}.slides{display:flex;transition:transform .45s ease}.slide{flex:0 0 100%;width:100%;aspect-ratio:767/380;object-fit:cover}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:30px;height:30px;background:#174d3bbd;color:white;font-size:23px;cursor:pointer}.prev{left:10px}.next{right:10px}.dots{display:flex;justify-content:center;gap:16px;margin:12px 0 23px}.dot{border:2px solid #0f503d;background:white;border-radius:50%;width:12px;height:12px;cursor:pointer;padding:0}.dot.active{background:#0f503d}.card{background:#fff;border-radius:16px;overflow:hidden}.banner{display:block;width:100%;aspect-ratio:448/225;object-fit:cover}.inside{padding:19px 20px 20px}.heading{display:flex;align-items:center;gap:9px;font-weight:750;font-size:18px}.tag{background:#10523f;color:white;font-size:13px;border-radius:5px;padding:3px 8px}.timer{margin-top:17px;background:#f1f1f1;border-radius:13px;padding:15px 16px}.timer .label{font-size:14px;color:#666}.time{margin-top:9px;text-align:center;font-size:20px;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums}.clock{color:#0f5943;margin-right:12px}.description{font-size:14px;margin:18px 0 29px;color:#555}.cta{display:block;background:#10533f;color:white;text-align:center;text-decoration:none;border-radius:12px;padding:13px;font-size:18px;font-weight:750}.cta:focus-visible,.arrow:focus-visible,.dot:focus-visible{outline:3px solid orange}@media(prefers-reduced-motion:reduce){.slides{transition:none}}
</style></head><body><main>
<header class="top"><button class="favorite" id="favorite" type="button">☆ 收藏</button><img class="logo" src="images/logo.png" alt="青山 Logo"><h1>青山</h1><p>青茶專業製作</p><span class="insta" aria-label="Instagram 標誌">◎</span></header>
<section aria-label="青山三張圖片輪播"><div class="carousel"><div class="slides" id="slides"><img class="slide" src="images/slide1.png" alt="青山品牌圖片一"><img class="slide" src="images/slide2.png" alt="青山品牌圖片二"><img class="slide" src="images/slide3.png" alt="青山品牌圖片三"></div><button type="button" class="arrow prev" id="prev" aria-label="上一張">‹</button><button type="button" class="arrow next" id="next" aria-label="下一張">›</button></div><div class="dots" id="dots" aria-label="選擇輪播圖片"></div></section>
<article class="card"><img class="banner" src="images/coupon-banner.png" alt="青山 65 元茗茶飲品折扣券"><div class="inside"><div class="heading">限時折扣派送中 <span class="tag" id="status">進行中</span></div><div class="timer"><div class="label">距離結束還有</div><div class="time" id="countdown"><span class="clock">◷</span>計算中…</div></div><p class="description">官方活動說明 限時派送，領完為止！</p><a class="cta" href="https://lin.ee/TojBraD" rel="noopener noreferrer">立即領取折扣券</a></div></article>
</main><script>
const slides=document.getElementById('slides'),dots=document.getElementById('dots');let current=0;const total=3;function show(n){current=(n+total)%total;slides.style.transform=`translateX(-${current*100}%)`;[...dots.children].forEach((el,i)=>el.classList.toggle('active',i===current))}for(let i=0;i<total;i++){const dot=document.createElement('button');dot.type='button';dot.className='dot';dot.setAttribute('aria-label',`第${i+1}張`);dot.addEventListener('click',()=>show(i));dots.append(dot)}document.getElementById('prev').addEventListener('click',()=>show(current-1));document.getElementById('next').addEventListener('click',()=>show(current+1));show(0);setInterval(()=>show(current+1),4000);
const end=new Date('2026-11-15T00:00:00+08:00').getTime();function tick(){let left=Math.max(0,end-Date.now());let d=Math.floor(left/86400000);left%=86400000;let h=Math.floor(left/3600000);left%=3600000;let m=Math.floor(left/60000);let s=Math.floor(left%60000/1000);document.getElementById('countdown').innerHTML=`<span class="clock">◷</span>${d}天&nbsp; ${String(h).padStart(2,'0')}時&nbsp; ${String(m).padStart(2,'0')}分&nbsp; ${String(s).padStart(2,'0')}秒`;if(Date.now()>=end){document.getElementById('status').textContent='已截止';document.getElementById('countdown').textContent='活動時間已結束'}}tick();setInterval(tick,1000);
document.getElementById('favorite').addEventListener('click',e=>{const on=e.currentTarget.dataset.saved!=='1';e.currentTarget.dataset.saved=on?'1':'0';e.currentTarget.textContent=on?'★ 已收藏':'☆ 收藏'});
</script></body></html>
